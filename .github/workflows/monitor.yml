name: RackNerd Promotion Monitor

on:
  schedule:
    # 避开整点与整20分高峰拥堵（例如 0, 20, 40 分全网拥堵会被 GitHub 丢弃），采用非对称分钟偏移
    - cron: '7,27,47 * * * *'
  workflow_dispatch: # 支持手动点击或通过 GitHub API 随时外部触发

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Monitor Script
        env:
          QYWX_WEBHOOK: ${{ secrets.QYWX_WEBHOOK }}
        run: |
          python main.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "chore: update promotion history [skip ci]" && git push)
